name: SSA Daily Booking Reminder

# Runs every 30 minutes between UTC 05:00 and 22:00.
# During BST (Mar–Oct): UTC 05:00 = 06:00 UK time.
# During GMT (Oct–Mar): UTC 06:00 = 06:00 UK time.
# The backend Europe/London guard (06:00–22:00) decides whether each run is
# active; runs outside the local window return status=skipped cleanly.
# Booking-signature idempotency (INSERT IGNORE on uid+rule_key+date+sig)
# ensures only the first eligible run per day sends a push — later runs in
# the same window return already_sent_or_reserved_for_rule_date.
on:
  schedule:
    - cron: "*/30 5-22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (inspect only, no pushes sent)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      uid:
        description: "Limit to one booking user id (leave blank for all users)"
        required: false
        default: ""
      force:
        description: "Bypass Europe/London 06:00-22:00 time guard (manual testing only)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  send-reminders:
    name: Send daily booking push reminders
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Build request body
        id: body
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          UID_INPUT="${{ github.event.inputs.uid || '' }}"
          FORCE="${{ github.event.inputs.force || 'false' }}"

          BODY="{\"dryRun\":${DRY_RUN}"
          if [ -n "$UID_INPUT" ] && [ "$UID_INPUT" != "" ]; then
            BODY="${BODY},\"uid\":${UID_INPUT}"
          fi
          BODY="${BODY},\"force\":${FORCE}}"

          echo "body=${BODY}" >> "$GITHUB_OUTPUT"
          echo "Request body: ${BODY}"

      - name: POST to daily booking reminder endpoint
        run: |
          HTTP_STATUS=$(curl --silent --show-error --output response.json \
            --write-out "%{http_code}" \
            --max-time 60 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-SSA-Cron-Secret: ${{ secrets.SSA_CRON_SECRET }}" \
            --data '${{ steps.body.outputs.body }}' \
            "https://ssabookings-api-development-iuenr.ondigitalocean.app/api/ssa/v1/run-daily-booking-reminders.php")

          echo "HTTP status: ${HTTP_STATUS}"
          echo "Response body:"
          cat response.json
          echo ""

          # Fail on non-2xx HTTP.
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "ERROR: endpoint returned HTTP ${HTTP_STATUS}"
            exit 1
          fi

          # Fail if response is not valid JSON.
          if ! jq -e '.' response.json > /dev/null 2>&1; then
            echo "ERROR: Backend returned non-JSON response (PHP fatal error?):"
            head -c 500 response.json
            exit 1
          fi

          # Parse and print key fields.
          BACKEND_STATUS=$(jq -r '.status // "unknown"' response.json)
          SKIPPED_REASON=$(jq -r '.skippedReason // ""' response.json)
          LOCAL_TIME=$(jq -r '.localTime // ""' response.json)
          ALLOWED_WINDOW=$(jq -r '.allowedWindow // ""' response.json)
          DRY_RUN_FLAG=$(jq -r '.dryRun // ""' response.json)
          FORCED_FLAG=$(jq -r '.forced // ""' response.json)
          ELIGIBLE=$(jq -r '.eligibleUserCount // ""' response.json)
          PROCESSED=$(jq -r '(.processed | length) // 0' response.json)
          SENT=$(jq -r '[.processed[]? | select(.sent == true)] | length' response.json)
          ALREADY_SENT=$(jq -r '[.processed[]? | select(.skippedReason == "already_sent_or_reserved_for_rule_date")] | length' response.json)
          NO_TOKEN=$(jq -r '[.processed[]? | select(.skippedReason == "no_enabled_ios_tokens")] | length' response.json)
          PREF_OFF=$(jq -r '[.processed[]? | select(.skippedReason == "preference_disabled")] | length' response.json)
          DRY_SKIP=$(jq -r '[.processed[]? | select(.skippedReason == "dry_run")] | length' response.json)

          echo "---"
          echo "status:          ${BACKEND_STATUS}"
          [ -n "$SKIPPED_REASON" ]   && echo "skippedReason:   ${SKIPPED_REASON}"
          [ -n "$ALLOWED_WINDOW" ]   && echo "allowedWindow:   ${ALLOWED_WINDOW}"
          [ -n "$LOCAL_TIME" ]       && echo "localTime:       ${LOCAL_TIME}"
          [ -n "$DRY_RUN_FLAG" ]     && echo "dryRun:          ${DRY_RUN_FLAG}"
          [ -n "$FORCED_FLAG" ]      && echo "forced:          ${FORCED_FLAG}"
          [ -n "$ELIGIBLE" ]         && echo "eligibleUsers:   ${ELIGIBLE}"
          echo "processed:       ${PROCESSED}"
          echo "sent:            ${SENT}"
          echo "alreadySent:     ${ALREADY_SENT}"
          echo "noToken:         ${NO_TOKEN}"
          echo "preferenceOff:   ${PREF_OFF}"
          [ "$DRY_SKIP" != "0" ]     && echo "dryRunSkipped:   ${DRY_SKIP}"

          # Fail only on error status.
          if [ "$BACKEND_STATUS" = "error" ]; then
            echo "ERROR: Backend returned status=error"
            jq -r '.error // .message // "no details"' response.json
            exit 1
          fi

          echo "---"
          echo "Run complete. status=${BACKEND_STATUS}"
